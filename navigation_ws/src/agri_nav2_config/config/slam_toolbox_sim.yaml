slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # Simulation frame policy:
    # map -> bb_robot/odom -> bb_robot/base_link
    map_frame: map
    odom_frame: bb_robot/odom
    base_frame: bb_robot/base_link

    # This topic is not available in the current bb_robot Gazebo model yet.
    # Add a 2D LiDAR bridge/model first, or remap this to the chosen scan topic.
    scan_topic: /scan

    mode: mapping
    resolution: 0.05
    transform_publish_period: 0.05
    map_update_interval: 2.0
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    use_scan_matching: true
    do_loop_closing: true
