# 升级版系统参数配置
# 用于升级版串口通讯系统的参数配置

# 串口通讯参数
serial_bridge:
  ros__parameters:
    # 串口设备配置
    serial_port: "/dev/ttyUSB0"
    baudrate: 115200
    slave_id: 1
    
    # 运动参数限制
    max_linear_speed: 1.0    # 最大线速度 (m/s)
    max_angular_speed: 2.0   # 最大角速度 (rad/s)
    
    # 监控频率
    battery_check_frequency: 1.0  # 电池检查频率 (Hz)
    
    # ROS话题配置
    cmd_vel_topic: "/cmd_vel"
    battery_voltage_topic: "/battery_voltage"
    modbus_connected_topic: "/modbus_connected"
    chassis_status_topic: "/chassis_status"

# 底盘控制参数（保留兼容性）
chassis_controller:
  ros__parameters:
    # 串口参数（已升级）
    serial_port: "/dev/ttyUSB0"
    baud_rate: 115200  # 从9600升级到115200
    device_id: 1
    
    # 控制参数
    max_speed_value: 1000  # 从255升级到1000
    control_frequency: 20.0  # 控制频率
    
    # 安全参数
    watchdog_timeout: 2.0
    emergency_stop_enabled: true
    
    # ModBus寄存器地址
    control_mode_register: 3    # 升级后的地址
    steering_register: 4        # 转向角度寄存器
    speed_register: 5          # 行驶速度寄存器
    battery_register: 6        # 电池电压寄存器

# 系统配置
system:
  ros__parameters:
    # 日志级别
    log_level: "INFO"
    
    # 系统模式
    use_upgraded_serial: true   # 是否使用升级版串口模块
    enable_battery_monitoring: true
    enable_connection_monitoring: true
    
    # 安全配置
    enable_watchdog: true
    emergency_stop_timeout: 0.5  # 紧急停止超时时间
