# 升级版底盘控制参数配置 - ModBus-RTU协议
chassis_controller:
  ros__parameters:
    # 升级版串口通信参数
    serial_port: "/dev/ttyUSB0"         # 串口设备路径
    baud_rate: 115200                   # 升级版波特率 (原版9600)
    timeout: 0.1                        # 串口超时时间 (优化)
    device_id: 1                        # ModBus从机地址
    
    # 运动控制参数
    max_linear_speed: 1.0               # 最大线速度 m/s
    max_angular_speed: 1.0              # 最大角速度 rad/s
    track_width: 1.12                   # 履带间距 m

    # 控制参数
    control_frequency: 10.0             # 控制频率 Hz
    enable_feedback: true               # 启用反馈读取
    
    # ROS话题配置
    control_topic: "/chassis_control/cmd"
    twist_topic: "/cmd_vel"
    status_topic: "/chassis_control/status"
    battery_topic: "/chassis_control/battery_voltage"        # 新增电池电压话题
    connection_topic: "/chassis_control/modbus_connected"    # 新增连接状态话题
    
    # 安全参数
    watchdog_timeout: 2.0               # 看门狗超时时间 s
    emergency_stop_enabled: true        # 紧急停止使能

# 串口测试节点参数 (兼容性)
serial_test:
  ros__parameters:
    serial_port: "/dev/ttyUSB0"
    baud_rate: 115200                   # 升级版波特率
    device_id: 1                        # ModBus从机地址
    test_mode: "modbus"                 # modbus, basic, motor, read

# 系统级配置
system:
  ros__parameters:
    # 升级版特性开关
    use_upgraded_serial: true           # 使用升级版串口模块
    enable_battery_monitoring: true     # 启用电池电压监控
    enable_connection_monitoring: true  # 启用连接状态监控
    enable_advanced_control_modes: true # 启用高级控制模式
    
    # 调试和日志
    debug_mode: false                   # 调试模式
    log_level: "INFO"                   # 日志级别: DEBUG, INFO, WARN, ERROR
